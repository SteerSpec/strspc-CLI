name: Setup strspc
description: >
  Install the strspc CLI from a GitHub release with checksum verification.
  Fails if the download, the checksum or the version check fails.

inputs:
  version:
    description: >
      strspc release to install: bare semver without leading "v"
      (e.g. "1.15.0") or "latest".
    required: false
    default: "latest"
  token:
    description: >
      Token for the GitHub API (release lookup) and asset download. The
      default is enough for public releases; pass a token to avoid rate
      limits on busy runners.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The installed strspc version (bare semver).
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install strspc
      id: install
      shell: bash
      # Inputs enter through env, never inline in the script: an input is
      # untrusted text once a caller can set it from an expression.
      env:
        REQUESTED: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: SteerSpec/strspc-CLI
      run: |
        set -euo pipefail

        api() {
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/$1"
        }

        # Downloads retry: release-please publishes the GitHub release first and
        # GoReleaser uploads the archives a minute later, so a lookup in that
        # window sees a release whose assets 404. Eight tries cover ~2 minutes.
        fetch() {
          local attempt
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$1" -o "$2"; then
              return 0
            fi
            echo "download failed (attempt ${attempt}/8): $1 — retrying in 15s" >&2
            sleep 15
          done
          return 1
        }

        if [ "$REQUESTED" = "latest" ]; then
          TAG=""
          if command -v jq >/dev/null 2>&1; then
            # Newest stable release whose checksums are already uploaded; skips a
            # release created seconds ago that GoReleaser has not populated yet.
            TAG="$(api "releases?per_page=10" | jq -r '[.[]
              | select((.draft or .prerelease) | not)
              | select(any(.assets[]; .name | endswith("_checksums.txt")))
              ][0].tag_name // empty')"
          fi
          if [ -z "$TAG" ]; then
            TAG="$(api "releases/latest" \
              | grep -oE '"tag_name": *"[^"]+"' | head -n1 | sed 's/.*"\(v[^"]*\)"/\1/')"
          fi
          VERSION="${TAG#v}"
        else
          VERSION="${REQUESTED#v}"
        fi
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::invalid strspc version '${REQUESTED}' (expected X.Y.Z or latest)" >&2
          exit 1
        fi

        case "${RUNNER_OS}" in
          Linux) OS=linux; EXT=tar.gz; EXE=strspc ;;
          macOS) OS=darwin; EXT=tar.gz; EXE=strspc ;;
          Windows) OS=windows; EXT=zip; EXE=strspc.exe ;;
          *) echo "::error::unsupported runner OS '${RUNNER_OS}'" >&2; exit 1 ;;
        esac
        case "${RUNNER_ARCH}" in
          X64) ARCH=amd64 ;;
          ARM64) ARCH=arm64 ;;
          *) echo "::error::unsupported runner architecture '${RUNNER_ARCH}'" >&2; exit 1 ;;
        esac

        # Asset names come from .goreleaser.yml (project name strspc-CLI).
        ARCHIVE="strspc-CLI_${VERSION}_${OS}_${ARCH}.${EXT}"
        BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"

        TMP="$(mktemp -d)"
        fetch "${BASE_URL}/${ARCHIVE}" "${TMP}/${ARCHIVE}"
        fetch "${BASE_URL}/strspc-CLI_${VERSION}_checksums.txt" "${TMP}/checksums.txt"

        EXPECTED="$(grep "  ${ARCHIVE}$" "${TMP}/checksums.txt" | cut -d' ' -f1 || true)"
        if [ -z "$EXPECTED" ]; then
          echo "::error::checksum entry not found for ${ARCHIVE}" >&2
          exit 1
        fi
        # macOS runners ship shasum, not GNU coreutils.
        if command -v sha256sum >/dev/null 2>&1; then
          echo "${EXPECTED}  ${TMP}/${ARCHIVE}" | sha256sum -c -
        else
          echo "${EXPECTED}  ${TMP}/${ARCHIVE}" | shasum -a 256 -c -
        fi

        BIN="${RUNNER_TEMP}/strspc-bin"
        mkdir -p "$BIN"
        if [ "$EXT" = "zip" ]; then
          unzip -q -o "${TMP}/${ARCHIVE}" "$EXE" -d "$BIN"
        else
          tar -xzf "${TMP}/${ARCHIVE}" -C "$BIN" "$EXE"
        fi
        chmod +x "${BIN}/${EXE}"
        echo "$BIN" >> "$GITHUB_PATH"
        rm -rf "$TMP"

        "${BIN}/${EXE}" version
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
