name: Setup strspc
description: >
  Install the strspc CLI from a GitHub release with checksum and build-provenance verification.
  Fails if the download, the checksum or the version check fails.

inputs:
  version:
    description: >
      strspc release to install: bare semver without leading "v"
      (e.g. "1.15.0") or "latest".
    required: false
    default: "latest"
  token:
    description: >
      Token for the GitHub API (release lookup) and asset download. The
      default is enough for public releases; pass a token to avoid rate
      limits on busy runners.
    required: false
    default: ${{ github.token }}
  cache:
    description: >
      Keep the downloaded archive in the Actions cache, keyed by version and
      platform, and download it only on a miss. The checksum and the build
      provenance are verified on every run, cache hit or not. On by default
      for SteerSpec repositories, so their CI doesn't dominate the release
      download counts (scripts/usage-report.sh), and off for others.
    required: false
    default: ${{ github.repository_owner == 'SteerSpec' }}

outputs:
  version:
    description: The installed strspc version (bare semver).
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve strspc version
      id: resolve
      shell: bash
      # Inputs enter through env, never inline in the script: an input is
      # untrusted text once a caller can set it from an expression.
      env:
        REQUESTED: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: SteerSpec/strspc-CLI
      run: |
        set -euo pipefail

        api() {
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/$1"
        }

        if [ "$REQUESTED" = "latest" ]; then
          TAG=""
          if command -v jq >/dev/null 2>&1; then
            # Newest stable release whose checksums are already uploaded; skips a
            # release created seconds ago that GoReleaser has not populated yet.
            TAG="$(api "releases?per_page=10" | jq -r '[.[]
              | select((.draft or .prerelease) | not)
              | select(any(.assets[]; .name | endswith("_checksums.txt")))
              ][0].tag_name // empty')"
          fi
          if [ -z "$TAG" ]; then
            TAG="$(api "releases/latest" \
              | grep -oE '"tag_name": *"[^"]+"' | head -n1 | sed 's/.*"\(v[^"]*\)"/\1/')"
          fi
          VERSION="${TAG#v}"
        else
          VERSION="${REQUESTED#v}"
        fi
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::invalid strspc version '${REQUESTED}' (expected X.Y.Z or latest)" >&2
          exit 1
        fi

        case "${RUNNER_OS}" in
          Linux) OS=linux; EXT=tar.gz; EXE=strspc ;;
          macOS) OS=darwin; EXT=tar.gz; EXE=strspc ;;
          Windows) OS=windows; EXT=zip; EXE=strspc.exe ;;
          *) echo "::error::unsupported runner OS '${RUNNER_OS}'" >&2; exit 1 ;;
        esac
        case "${RUNNER_ARCH}" in
          X64) ARCH=amd64 ;;
          ARM64) ARCH=arm64 ;;
          *) echo "::error::unsupported runner architecture '${RUNNER_ARCH}'" >&2; exit 1 ;;
        esac

        # Asset names come from .goreleaser.yml (project name strspc-CLI).
        ARCHIVE="strspc-CLI_${VERSION}_${OS}_${ARCH}.${EXT}"
        {
          echo "version=${VERSION}"
          echo "archive=${ARCHIVE}"
          echo "ext=${EXT}"
          echo "exe=${EXE}"
        } >> "$GITHUB_OUTPUT"

    # Only the archive is cached. The checksums file is fetched on every run
    # and the attestation checked, so a cached archive is verified exactly
    # as a downloaded one. Entries are saved under a fresh key and restored
    # by prefix, newest first, so an archive downloaded to replace a bad
    # entry supersedes it: an exact key would never be saved again.
    - name: Restore strspc archive
      # An input default from an expression may be a boolean; compare as text.
      if: format('{0}', inputs.cache) == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/strspc-archive
        key: strspc-${{ steps.resolve.outputs.archive }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: strspc-${{ steps.resolve.outputs.archive }}-

    - name: Install strspc
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: SteerSpec/strspc-CLI
        VERSION: ${{ steps.resolve.outputs.version }}
        ARCHIVE: ${{ steps.resolve.outputs.archive }}
        EXT: ${{ steps.resolve.outputs.ext }}
        EXE: ${{ steps.resolve.outputs.exe }}
        CACHE_DIR: ${{ runner.temp }}/strspc-archive
        USE_CACHE: ${{ inputs.cache }}
      run: |
        set -euo pipefail

        # Downloads retry: release-please publishes the GitHub release first and
        # GoReleaser uploads the archives a minute later, so a lookup in that
        # window sees a release whose assets 404. Eight tries cover ~2 minutes.
        fetch() {
          local attempt
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$1" -o "$2"; then
              return 0
            fi
            echo "download failed (attempt ${attempt}/8): $1 — retrying in 15s" >&2
            sleep 15
          done
          return 1
        }

        BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"
        TMP="$(mktemp -d)"
        fetch "${BASE_URL}/strspc-CLI_${VERSION}_checksums.txt" "${TMP}/checksums.txt"
        EXPECTED="$(grep "  ${ARCHIVE}$" "${TMP}/checksums.txt" | cut -d' ' -f1 || true)"
        if [ -z "$EXPECTED" ]; then
          echo "::error::checksum entry not found for ${ARCHIVE}" >&2
          exit 1
        fi
        # macOS runners ship shasum, not GNU coreutils.
        checksum_ok() {
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${EXPECTED}  ${TMP}/${ARCHIVE}" | sha256sum -c -
          else
            echo "${EXPECTED}  ${TMP}/${ARCHIVE}" | shasum -a 256 -c -
          fi
        }

        # A cached archive is used only when it matches the checksum of the
        # release; one that doesn't is dropped and downloaded again.
        CACHED=0
        if [ "$USE_CACHE" = true ] && [ -s "${CACHE_DIR}/${ARCHIVE}" ]; then
          cp "${CACHE_DIR}/${ARCHIVE}" "${TMP}/${ARCHIVE}"
          if checksum_ok; then
            echo "using the cached ${ARCHIVE}"
            CACHED=1
          else
            echo "::warning::the cached ${ARCHIVE} doesn't match the release checksum; downloading it again"
            rm -f "${CACHE_DIR}/${ARCHIVE}" "${TMP}/${ARCHIVE}"
          fi
        fi
        if [ "$CACHED" = 0 ]; then
          fetch "${BASE_URL}/${ARCHIVE}" "${TMP}/${ARCHIVE}"
          checksum_ok
        fi
        SAVE=false
        [ "$USE_CACHE" = true ] && [ "$CACHED" = 0 ] && SAVE=true

        # The checksum comes from the same release as the archive, so it proves
        # integrity, not origin. Releases after ATTESTED_AFTER carry a build
        # provenance attestation: verify that the archive was built by this
        # repository's release workflow at the release tag, on a GitHub-hosted
        # runner. Older releases predate it and only warn.
        ATTESTED_AFTER="1.43.0"
        # Portable X.Y.Z comparison (BSD sort on macOS has no -V).
        newer_than() {
          local IFS=. i
          local -a a=($1) b=($2)
          for i in 0 1 2; do
            [ "${a[i]}" -gt "${b[i]}" ] && return 0
            [ "${a[i]}" -lt "${b[i]}" ] && return 1
          done
          return 1
        }
        verify_attestation() {
          gh attestation verify "${TMP}/${ARCHIVE}" --repo "${REPO}" \
            --signer-workflow "${REPO}/.github/workflows/release.yml" \
            --source-ref "refs/tags/v${VERSION}" --deny-self-hosted-runners 2>&1 >/dev/null
        }
        if newer_than "$VERSION" "$ATTESTED_AFTER"; then
          # The attestation is published a moment after the release assets, so
          # a release created seconds ago may not have one yet: retry.
          ATTEMPTS=6
        else
          ATTEMPTS=1
        fi
        ATTEST_OK=0
        for attempt in $(seq 1 "$ATTEMPTS"); do
          if ATTEST_ERR="$(verify_attestation)"; then
            ATTEST_OK=1
            break
          fi
          if [ "$attempt" -lt "$ATTEMPTS" ]; then
            echo "attestation not verified (attempt ${attempt}/${ATTEMPTS}) — retrying in 15s" >&2
            sleep 15
          fi
        done
        if [ "$ATTEST_OK" = 0 ]; then
          if newer_than "$VERSION" "$ATTESTED_AFTER"; then
            echo "::error::build provenance verification failed for ${ARCHIVE}: ${ATTEST_ERR}" >&2
            exit 1
          fi
          echo "::warning::strspc ${VERSION} predates build provenance attestations; only the checksum was verified."
        fi

        # Only a verified archive is kept for the cache to save.
        if [ "$USE_CACHE" = true ]; then
          mkdir -p "$CACHE_DIR"
          cp "${TMP}/${ARCHIVE}" "${CACHE_DIR}/${ARCHIVE}"
        fi

        BIN="${RUNNER_TEMP}/strspc-bin"
        mkdir -p "$BIN"
        if [ "$EXT" = "zip" ]; then
          # Git Bash on Windows runners doesn't guarantee unzip; PowerShell is
          # always there. Paths go through env, so nothing needs quoting twice.
          ARCHIVE_PATH="$(cygpath -w "${TMP}/${ARCHIVE}")" BIN_PATH="$(cygpath -w "$BIN")" \
            powershell -NoProfile -NonInteractive -Command \
            'Expand-Archive -Force -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:BIN_PATH'
        else
          tar -xzf "${TMP}/${ARCHIVE}" -C "$BIN" "$EXE"
        fi
        chmod +x "${BIN}/${EXE}"
        echo "$BIN" >> "$GITHUB_PATH"
        rm -rf "$TMP"

        "${BIN}/${EXE}" version
        {
          echo "version=${VERSION}"
          echo "save=${SAVE}"
        } >> "$GITHUB_OUTPUT"

    # Saved only after a download, which the install step verified.
    - name: Save strspc archive
      if: format('{0}', inputs.cache) == 'true' && steps.install.outputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/strspc-archive
        key: strspc-${{ steps.resolve.outputs.archive }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
