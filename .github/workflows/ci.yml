name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          # `config verify` downloads the JSON schema from golangci-lint.run on
          # every run and has timed out repeatedly; `make lint` verifies locally.
          verify: false

  # Dogfood: the released CLI validates this repository's realm and
  # evaluates the change through the org-wide reusable workflows
  # (SteerSpec/.github). Without ANTHROPIC_API_KEY the check is static-only.
  # Rule lifecycle moves one step per PR into develop. A release (the
  # same-repository develop -> main PR, and the resulting push to main)
  # aggregates those steps, which rulediff reads as skipped states (RD003), so
  # exactly those are exempt from the diff; any other PR into main is checked.
  rules:
    uses: SteerSpec/.github/.github/workflows/strspc-lint.yml@main
    # A called workflow cannot hold more permissions than the caller grants;
    # pull-requests: read lets `strspc diff --pr` resolve the base.
    permissions:
      contents: read
      pull-requests: read
    with:
      path: rules/
      diff: >-
        ${{ !(
          (
            github.event_name == 'pull_request'
            && github.base_ref == 'main'
            && github.head_ref == 'develop'
            && github.event.pull_request.head.repo.full_name == github.repository
          )
          || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        ) }}

  check:
    uses: SteerSpec/.github/.github/workflows/strspc-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  setup-action:
    # Smoke test for the composite action other repositories install the
    # released CLI with (SteerSpec/.github reusable workflows, strspc-rules CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-strspc
        id: pinned
        with:
          version: "1.15.0"
      - run: test "${INSTALLED}" = "1.15.0" && strspc version
        env:
          INSTALLED: ${{ steps.pinned.outputs.version }}

  setup-action-windows:
    # Same smoke test on Windows. 1.26.0 is the first release with Windows
    # archives. The second step checks PATH from PowerShell, the default shell.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-strspc
        id: pinned
        with:
          version: "1.26.0"
      - run: test "${INSTALLED}" = "1.26.0" && strspc version
        shell: bash
        env:
          INSTALLED: ${{ steps.pinned.outputs.version }}
      - run: strspc version
