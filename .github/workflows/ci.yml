name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3

  # Dogfood: the released CLI validates this repository's realm and
  # evaluates the change through the org-wide reusable workflows
  # (SteerSpec/.github). Without ANTHROPIC_API_KEY the check is static-only.
  rules:
    uses: SteerSpec/.github/.github/workflows/strspc-lint.yml@ci/reusable-strspc-workflows
    with:
      path: rules/

  check:
    uses: SteerSpec/.github/.github/workflows/strspc-check.yml@ci/reusable-strspc-workflows
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  setup-action:
    # Smoke test for the composite action other repositories install the
    # released CLI with (SteerSpec/.github reusable workflows, strspc-rules CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-strspc
        id: pinned
        with:
          version: "1.15.0"
      - run: test "${INSTALLED}" = "1.15.0" && strspc version
        env:
          INSTALLED: ${{ steps.pinned.outputs.version }}

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
