# SteerSpec configuration
# Reference: https://github.com/SteerSpec/strspc-CLI#readme

# Rule sources — where to fetch rules from
rules:
  # Core rules from the SteerSpec specification. github:// sources resolve once
  # strspc-manager ships remote fetching; until then CI runs against ./rules only.
  # - source: github://SteerSpec/strspc-rules@v1.6.0/rules/core
  #   scope: global

  # Local CLI-specific rules (dev.steerspec.cli realm)
  - source: ./rules/
    scope: local

# AI evaluator settings
evaluator:
  provider: null          # CI has no ANTHROPIC_API_KEY yet; switch to claude in E8
  # model: claude-sonnet-5-5
  # effort: medium

# Local cache settings
cache:
  ttl: 24h                # how long cached evaluations stay valid

# Which rule states cause a failure (state codes: D, A, P, I, R, T)
fail_on:
  - I                     # Implemented rules block merges when violated
  # - P                   # uncomment to also enforce Published rules
