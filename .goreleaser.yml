version: 2

builds:
  - id: strspc
    main: ./src
    binary: strspc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitBranch={{.Branch}}

archives:
  - formats: [tar.gz]
    # Listing `files` REPLACES goreleaser's defaults
    # (license*/LICENSE*/readme*/README*/changelog*/CHANGELOG*) rather than
    # adding to them, so the defaults worth keeping are repeated here.
    # NOTICE is the reason this block exists: it is not in the defaults, and
    # Apache 2.0 section 4(d) requires redistributions of a work that has a
    # NOTICE file to carry its attribution notices. Release tarballs are
    # redistribution.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Sign and notarize the macOS binaries. Off until the MACOS_* secrets exist.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - strspc
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

# Cask, not formula: goreleaser deprecated `brews`.
homebrew_casks:
  - name: strspc
    repository:
      owner: SteerSpec
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/SteerSpec/strspc-CLI
    description: CLI for SteerSpec
