version: 2

builds:
  - main: ./src
    binary: strspc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitBranch={{.Branch}}

archives:
  - formats: [tar.gz]
    # Listing `files` REPLACES goreleaser's defaults
    # (license*/LICENSE*/readme*/README*/changelog*/CHANGELOG*) rather than
    # adding to them, so the defaults worth keeping are repeated here.
    # NOTICE is the reason this block exists: it is not in the defaults, and
    # Apache 2.0 section 4(d) requires redistributions of a work that has a
    # NOTICE file to carry its attribution notices. Release tarballs are
    # redistribution.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Cask, not formula: goreleaser deprecated `brews`. macOS only; Linux users
# install from the release tarballs.
homebrew_casks:
  - name: strspc
    repository:
      owner: SteerSpec
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/SteerSpec/strspc-CLI
    description: CLI for SteerSpec
    # Binaries are unsigned; clear the quarantine flag so Gatekeeper doesn't block them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/strspc"]
          end
