version: 2

builds:
  - main: ./src
    binary: strspc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitBranch={{.Branch}}

archives:
  - formats: [tar.gz]
    # Listing `files` REPLACES goreleaser's defaults
    # (license*/LICENSE*/readme*/README*/changelog*/CHANGELOG*) rather than
    # adding to them, so the defaults worth keeping are repeated here.
    # NOTICE is the reason this block exists: it is not in the defaults, and
    # Apache 2.0 section 4(d) requires redistributions of a work that has a
    # NOTICE file to carry its attribution notices. Release tarballs are
    # redistribution.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Cask, not formula: goreleaser deprecated `brews`.
homebrew_casks:
  - name: strspc
    repository:
      owner: SteerSpec
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/SteerSpec/strspc-CLI
    description: CLI for SteerSpec
    # Binaries are unsigned. Quarantine is left intact (no automatic Gatekeeper
    # bypass); users opt out explicitly via the caveat below.
    caveats: |
      strspc is not code-signed. If macOS reports it as damaged or blocks it, run:
        xattr -dr com.apple.quarantine "$(brew --prefix)/bin/strspc"
