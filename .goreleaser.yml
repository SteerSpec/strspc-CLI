version: 2

# The diagnostic codes this release reports, as `strspc explain --list --json`
# prints them, published with the release so that steerspec.dev can build its
# per-code pages for a given version without running the binary. build/ is
# ignored by git, so the hook leaves the tree clean.
before:
  hooks:
    - mkdir -p build
    - sh -c 'go run ./src explain --list --json > build/diagnostics.json'

builds:
  - id: strspc
    main: ./src
    binary: strspc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitBranch={{.Branch}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listing `files` REPLACES goreleaser's defaults
    # (license*/LICENSE*/readme*/README*/changelog*/CHANGELOG*) rather than
    # adding to them, so the defaults worth keeping are repeated here.
    # NOTICE is the reason this block exists: it is not in the defaults, and
    # Apache 2.0 section 4(d) requires redistributions of a work that has a
    # NOTICE file to carry its attribution notices. Release tarballs are
    # redistribution.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

release:
  extra_files:
    - glob: build/diagnostics.json
      name_template: "strspc-CLI_{{ .Version }}_diagnostics.json"

# The checksums cover the diagnostics file too.
checksum:
  extra_files:
    - glob: build/diagnostics.json
      name_template: "strspc-CLI_{{ .Version }}_diagnostics.json"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Sign and notarize the macOS binaries. Off until all five MACOS_* secrets
# exist; release.yml fails the job if only some of them are set.
notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_SIGN_PASSWORD") (isEnvSet "MACOS_NOTARY_KEY") (isEnvSet "MACOS_NOTARY_KEY_ID") (isEnvSet "MACOS_NOTARY_ISSUER_ID") }}'
      ids:
        - strspc
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

# Cask, not formula: goreleaser deprecated `brews`.
homebrew_casks:
  - name: strspc
    repository:
      owner: SteerSpec
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/SteerSpec/strspc-CLI
    description: CLI for SteerSpec
